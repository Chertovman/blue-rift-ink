[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
ink = "${INK_RPC_URL}"
ink_sepolia = "${INK_SEPOLIA_RPC_URL}"
